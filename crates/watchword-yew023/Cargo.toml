[package]
name = "watchword-yew023"
version = "0.1.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "watchword's Yew 0.23 frontend: sign-in, registration, account and user management components, the auth context and its HTTP client."
documentation = "https://docs.rs/watchword"
readme = "README.md"
repository = "https://github.com/udoprog/watchword"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "session", "wasm", "yew"]
categories = ["authentication", "wasm", "web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(watchword_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "watchword_docsrs"]

[features]
default = []
musliweb04 = ["dep:musli-web04", "watchword-core/musliweb04"]

# yew's macros expand to `::yew::` paths, so the dependency key must stay `yew`.
[dependencies]
watchword-core = { path = "../watchword-core", version = "=0.1.0" }
yew = "0.23.0"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
jiff = { version = "0.2.37", features = ["js"] }
serde = "1.0.229"
wasm-bindgen-futures = "0.4.56"
# A path dependency until phrasebook is on crates.io; the path is that of the
# main checkout, next to which phrasebook is checked out (../phrasebook).
phrasebook01 = { package = "phrasebook", version = "0.1.0", path = "../../../phrasebook", features = ["yew023"] }
musli-web04 = { package = "musli-web", version = "0.4.11", default-features = false, features = ["web03"], optional = true }
web-sys = { version = "0.3.83", features = ["Clipboard", "History", "HtmlInputElement", "HtmlSelectElement", "Location", "Navigator", "RequestCredentials", "Window"] }

[dev-dependencies]
serde_json = "1.0.151"
