[package]
name = "watchword-yew023"
version = "0.6.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
rust-version = "1.95"
description = "watchword's Yew 0.23 frontend: sign-in, registration, account and user management components, the auth context and its HTTP client."
documentation = "https://docs.rs/watchword"
readme = "README.md"
repository = "https://github.com/udoprog/watchword"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "session", "wasm", "yew"]
categories = ["authentication", "wasm", "web-programming"]
include = ["/src/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(watchword_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "watchword_docsrs"]

[features]
default = ["std"]
std = ["alloc", "watchword-core/std", "watchword-core/phrasebookcatalog01", "serde/std", "jiff/std", "musli-web06?/std"]
alloc = ["watchword-core/alloc", "serde/alloc", "jiff/alloc"]
musliweb06 = ["std", "dep:musli-web06", "watchword-core/musliweb06"]

[dependencies]
watchword-core = { path = "../watchword-core", version = "=0.6.0", default-features = false }
yew = "0.23.0"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
jiff = { version = "0.2.37", default-features = false, features = ["js"] }
serde = { version = "1.0.229", default-features = false }
wasm-bindgen-futures = "0.4.56"
phrasebook02 = { package = "phrasebook", version = "0.2.0", features = ["yew023"] }
musli-web06 = { package = "musli-web", version = "0.6.0", default-features = false, features = ["web03"], optional = true }
web-sys = { version = "0.3.83", features = ["AbortController", "AbortSignal", "Blob", "Clipboard", "Document", "Element", "Headers", "History", "HtmlAnchorElement", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Location", "MutationObserver", "MutationObserverInit", "MutationRecord", "Navigator", "Node", "NodeList", "Request", "RequestCredentials", "Response", "Storage", "Url", "Window", "console"] }

[dev-dependencies]
serde_json = "1.0.151"
