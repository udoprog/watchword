[package]
name = "watchword-core"
version = "0.3.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
rust-version = "1.95"
description = "The types watchword's server and frontends share: users, roles, the wire types of its routes, and AuthError."
documentation = "https://docs.rs/watchword"
readme = "README.md"
repository = "https://github.com/udoprog/watchword"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "axum", "session", "yew"]
categories = ["authentication", "wasm", "web-programming"]
include = ["/src/**", "/locales/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(watchword_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "watchword_docsrs"]

[features]
default = ["std"]
std = ["alloc", "serde/std", "jiff/std", "thiserror/std", "musli-core02?/std", "musli-web05?/std"]
alloc = ["serde/alloc", "jiff/alloc", "musli-core02?/alloc", "musli-web05?/alloc"]
musli02 = ["dep:musli-core02"]
musliweb05 = ["alloc", "musli02", "dep:musli-web05"]
axum08 = ["std", "dep:axum08"]
sqll015 = ["std", "dep:sqll015"]
phrasebookcatalog01 = ["dep:phrasebookcatalog01"]

[dependencies]
jiff = { version = "0.2.37", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.18", default-features = false }

musli-core02 = { package = "musli-core", version = "0.2.0", default-features = false, optional = true }
musli-web05 = { package = "musli-web", version = "0.5.0", default-features = false, features = ["api"], optional = true }
axum08 = { package = "axum", version = "0.8.9", default-features = false, features = ["json"], optional = true }
# `threadsafe`, or an app's `bundled` sqll-sys builds SQLite with SQLITE_THREADSAFE=0.
sqll015 = { package = "sqll", version = "0.15.0", default-features = false, features = ["threadsafe"], optional = true }
phrasebookcatalog01 = { package = "phrasebook-catalog", version = "0.1.0", optional = true }

[dev-dependencies]
phrasebook = "0.2.0"
musli = { version = "0.2.0", features = ["storage", "wire", "descriptive", "json"] }
serde_json = "1.0.151"
sqll015 = { package = "sqll", version = "0.15.0", features = ["bundled"] }
