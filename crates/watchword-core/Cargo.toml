[package]
name = "watchword-core"
version = "0.1.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "The types watchword's server and frontends share: users, roles, the wire types of its routes, and AuthError."
documentation = "https://docs.rs/watchword"
readme = "README.md"
repository = "https://github.com/udoprog/watchword"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "axum", "session", "yew"]
categories = ["authentication", "wasm", "web-programming"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(watchword_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "watchword_docsrs"]

# Builds for wasm32-unknown-unknown with any feature but `axum08`.
[features]
default = []
musli01 = ["dep:musli-core01"]
# `IntoResponse` for `AuthError`; watchword's `axum08` feature turns it on.
axum08 = ["dep:axum08"]

[dependencies]
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"

musli-core01 = { package = "musli-core", version = "0.1.7", default-features = false, features = ["alloc", "std"], optional = true }
axum08 = { package = "axum", version = "0.8.9", default-features = false, features = ["json"], optional = true }

[dev-dependencies]
musli = { version = "0.1.9", features = ["storage"] }
serde_json = "1.0.151"
