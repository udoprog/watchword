[package]
name = "watchword-example-frontend"
version = "0.0.0"
edition = "2024"
publish = false
description = "The watchword example's Yew frontend, built with trunk."
license = "MIT OR Apache-2.0"

[dependencies]
api = { package = "watchword-example-api", path = "../api" }
auth = { package = "watchword", path = "../../..", features = ["musliweb04", "yew023"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
musli-web = { version = "0.4.11", default-features = false, features = ["web03"] }
serde = "1.0.229"
wasm-bindgen-futures = "0.4.56"
yew = { version = "0.23.0", features = ["csr"] }
