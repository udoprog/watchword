[package]
name = "watchword-example-frontend"
version = "0.0.0"
edition = "2024"
publish = false
description = "The watchword example's Yew frontend, built with trunk."
license = "MIT OR Apache-2.0"

[dependencies]
api = { package = "watchword-example-api", path = "../api" }
auth = { package = "watchword", path = "../../..", features = ["musliweb06", "yew023"] }
musli-web = { version = "0.6.0", default-features = false, features = ["web03"] }
yew = { version = "0.23.0", features = ["csr"] }
