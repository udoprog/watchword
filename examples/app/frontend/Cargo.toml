[package]
name = "yew-auth-example-frontend"
version = "0.0.0"
edition = "2024"
publish = false
description = "The yew-auth example's Yew frontend, built with trunk."
license = "MIT OR Apache-2.0"

[dependencies]
auth = { package = "yew-auth", path = "../../..", features = ["yew"] }
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
serde = "1.0.229"
serde_json = "1.0.151"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
web-sys = { version = "0.3.83", features = ["CloseEvent", "Location", "MessageEvent", "WebSocket", "Window"] }
yew = { version = "0.23.0", features = ["csr"] }
