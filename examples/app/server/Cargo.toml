[package]
name = "watchword-example-server"
version = "0.0.0"
edition = "2024"
publish = false
description = "The watchword example's axum server."
license = "MIT OR Apache-2.0"

[dependencies]
api = { package = "watchword-example-api", path = "../api" }
auth = { package = "watchword", path = "../../..", features = ["axum08", "cloudflare", "google", "musliweb04"] }
axum = { version = "0.8.9", features = ["ws"] }
musli-web = { version = "0.4.11", default-features = false, features = ["axum08"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.11", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
