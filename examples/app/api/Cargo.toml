[package]
name = "watchword-example-api"
version = "0.0.0"
edition = "2024"
publish = false
description = "The watchword example's own musli-web API, shared by its server and frontend."
license = "MIT OR Apache-2.0"

[dependencies]
musli = "0.2.0"
musli-web = { version = "0.5.0", default-features = false, features = ["api"] }
# watchword's endpoints and broadcast, included in the app's list.
watchword-core = { path = "../../../crates/watchword-core", default-features = false, features = ["musliweb05"] }
