[package]
name = "watchword"
version = "0.1.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "Authentication for axum servers and Yew frontends: password, Cloudflare Access and Google sign-in, sessions and user management."
documentation = "https://docs.rs/watchword"
readme = "README.md"
repository = "https://github.com/udoprog/watchword"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "axum", "oauth", "session", "yew"]
categories = ["authentication", "wasm", "web-programming"]
# The sqll tests include the migrations under docs/sqll; examples/app, CI
# config and build output stay out of the package.
include = ["/src/**", "/docs/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[lib]
name = "watchword"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(watchword_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "watchword_docsrs"]

# The features are disjoint: server-only dependencies (bcrypt, aws-lc-rs,
# tokio, axum, reqwest, sqll) and browser-only ones (yew, gloo-net, web-sys)
# never share a feature, so a wasm frontend takes `yew` without server code.
# With no features only the wasm-safe `types` module is built.
[features]
default = []
musli = ["dep:musli-core"]
server = ["dep:base64", "dep:bcrypt", "dep:cookie", "dep:hmac", "dep:http", "dep:rand", "dep:sha2", "dep:tokio", "dep:tracing"]
cloudflare = ["server", "dep:aws-lc-rs", "dep:reqwest", "dep:serde_json"]
google = ["server", "dep:reqwest", "dep:serde_json", "dep:url", "dep:lru"]
axum = ["server", "dep:axum", "tokio/macros"]
sqll = ["server", "dep:sqll"]
# Lets an app's tests point the Google client at a local server; with `axum`
# it also provides `google::fake::FakeGoogle`, a fake Google to point it at.
test-util = ["google"]
yew = ["dep:yew", "dep:gloo-net", "dep:web-sys", "dep:wasm-bindgen-futures", "jiff/js"]

[dependencies]
# types (always)
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"

# musli
musli-core = { version = "0.1.7", default-features = false, features = ["alloc", "std"], optional = true }

# server
base64 = { version = "0.22.1", optional = true }
bcrypt = { version = "0.19.1", optional = true }
cookie = { version = "0.18.1", optional = true }
hmac = { version = "0.13.0", optional = true }
http = { version = "1.5.0", optional = true }
rand = { version = "0.10.3", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }

# cloudflare, google
aws-lc-rs = { version = "1.18.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1.0.151", optional = true }
url = { version = "2.5.8", optional = true }
lru = { version = "0.18.5", optional = true }

# axum
axum = { version = "0.8.9", optional = true }

# sqll
sqll = { version = "0.14.6", optional = true }

# yew
yew = { version = "0.23.0", optional = true }
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"], optional = true }
web-sys = { version = "0.3.83", features = ["Clipboard", "History", "HtmlInputElement", "HtmlSelectElement", "Location", "Navigator", "RequestCredentials", "Window"], optional = true }
wasm-bindgen-futures = { version = "0.4.56", optional = true }

[dev-dependencies]
musli = { version = "0.1.9", features = ["storage"] }
serde_json = "1.0.151"
# A bundled SQLite for the `sqll` tests; apps pick their own linking.
sqll = { version = "0.14.6", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
