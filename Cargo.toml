[package]
name = "watchword"
version = "0.2.1"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "Authentication for axum servers and Yew frontends: password, Cloudflare Access and Google sign-in, sessions and user management."
documentation = "https://docs.rs/watchword"
readme = "README.md"
repository = "https://github.com/udoprog/watchword"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "axum", "oauth", "session", "yew"]
categories = ["authentication", "wasm", "web-programming"]
# The sqll tests include docs/sqll/impersonator.sql.
include = ["/src/**", "/docs/sqll/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[lib]
name = "watchword"

[workspace]
members = ["crates/watchword-core", "crates/watchword-yew023"]
exclude = ["examples/app"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(watchword_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "watchword_docsrs"]

[features]
default = []
musli01 = ["watchword-core/musli01"]
musliweb04 = ["musli01", "watchword-core/musliweb04", "dep:musli-web04", "watchword-yew023?/musliweb04"]
server = ["dep:base64", "dep:bcrypt", "dep:cookie", "dep:hmac", "dep:http", "dep:rand", "dep:sha2", "dep:tokio", "tokio/macros", "dep:tracing"]
cloudflare = ["server", "dep:aws-lc-rs", "dep:reqwest", "dep:serde_json"]
google = ["server", "dep:reqwest", "dep:serde_json", "dep:url", "dep:lru"]
axum08 = ["server", "dep:axum08", "watchword-core/axum08", "musli-web04?/ws"]
sqll014 = ["server", "dep:sqll014"]
test-util = ["google"]
yew023 = ["dep:watchword-yew023"]

[dependencies]
# types
watchword-core = { path = "crates/watchword-core", version = "=0.2.1" }
jiff = { version = "0.2.37", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.18"

# server
base64 = { version = "0.22.1", optional = true }
bcrypt = { version = "0.19.1", optional = true }
cookie = { version = "0.18.1", optional = true }
hmac = { version = "0.13.0", optional = true }
http = { version = "1.5.0", optional = true }
rand = { version = "0.10.3", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", optional = true }

# cloudflare, google
aws-lc-rs = { version = "1.18.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1.0.151", optional = true }
url = { version = "2.5.8", optional = true }
lru = { version = "0.18.5", optional = true }

# axum08
axum08 = { package = "axum", version = "0.8.9", optional = true }

# musliweb04; with axum08 its `ws` server side
musli-web04 = { package = "musli-web", version = "0.4.11", default-features = false, optional = true }

# sqll014; only what `SqllStore` uses. `threadsafe` because pooled statements
# are converted to `SendStatement`. The app picks the linking (`bundled` or a
# system SQLite) and anything else (`std`, `alloc`) it needs itself.
sqll014 = { package = "sqll", version = "0.14.7", default-features = false, features = ["derive", "pool", "typed", "threadsafe"], optional = true }

# yew023
watchword-yew023 = { path = "crates/watchword-yew023", version = "=0.2.1", optional = true }

[dev-dependencies]
# The musliweb04 socket tests: a real axum server and tungstenite client.
musli-web04 = { package = "musli-web", version = "0.4.11", default-features = false, features = ["axum08", "tungstenite030"] }
musli = "0.1.9"
serde_json = "1.0.151"
sqll014 = { package = "sqll", version = "0.14.7", features = ["bundled"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
