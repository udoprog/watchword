[package]
name = "watchword"
version = "0.3.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
rust-version = "1.95"
description = "Authentication for axum servers and Yew frontends: password, Cloudflare Access and Google sign-in, sessions and user management."
documentation = "https://docs.rs/watchword"
readme = "README.md"
repository = "https://github.com/udoprog/watchword"
license = "MIT OR Apache-2.0"
keywords = ["authentication", "axum", "oauth", "session", "yew"]
categories = ["authentication", "wasm", "web-programming"]
include = ["/src/**", "/examples/sqll-store/**", "/README.md", "/LICENSE-*", "/Cargo.toml"]

[lib]
name = "watchword"

[workspace]
members = ["crates/watchword-core", "crates/watchword-yew023"]
exclude = ["examples/app"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(watchword_docsrs)'] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "watchword_docsrs"]

[features]
default = ["std"]
std = ["alloc", "watchword-core/std", "watchword-yew023?/std", "serde/std", "jiff/std", "thiserror/std", "musli-web05?/std"]
alloc = ["watchword-core/alloc", "serde/alloc", "jiff/alloc", "musli-web05?/alloc"]
musli02 = ["watchword-core/musli02"]
musliweb05 = ["alloc", "musli02", "watchword-core/musliweb05", "dep:musli-web05", "watchword-yew023?/musliweb05"]
server = ["std", "dep:base64", "dep:bcrypt", "dep:cookie", "dep:hmac", "dep:http", "dep:rand", "dep:sha2", "dep:tokio", "tokio/macros", "dep:tracing"]
cloudflare = ["server", "dep:aws-lc-rs", "dep:reqwest", "dep:serde_json"]
google = ["server", "dep:reqwest", "dep:serde_json", "dep:url", "dep:lru", "axum08?/query"]
axum08 = ["server", "dep:axum08", "watchword-core/axum08", "musli-web05?/ws"]
sqll015 = ["watchword-core/sqll015"]
test-util = ["server", "axum08?/http1"]
phrasebookcatalog01 = ["watchword-core/phrasebookcatalog01"]
yew023 = ["std", "phrasebookcatalog01", "dep:watchword-yew023"]

[dependencies]
watchword-core = { path = "crates/watchword-core", version = "=0.3.0", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["serde"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
thiserror = { version = "2.0.18", default-features = false }

base64 = { version = "0.22.1", optional = true }
bcrypt = { version = "0.19.1", optional = true }
cookie = { version = "0.18.1", optional = true }
hmac = { version = "0.13.0", optional = true }
http = { version = "1.5.0", optional = true }
rand = { version = "0.10.3", optional = true }
sha2 = { version = "0.11.0", optional = true }
tokio = { version = "1.53.1", features = ["rt", "sync", "time"], optional = true }
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }

aws-lc-rs = { version = "1.18.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
serde_json = { version = "1.0.151", optional = true }
url = { version = "2.5.8", optional = true }
lru = { version = "0.18.5", optional = true }

axum08 = { package = "axum", version = "0.8.9", default-features = false, features = ["tokio"], optional = true }

musli-web05 = { package = "musli-web", version = "0.5.0", default-features = false, optional = true }

watchword-yew023 = { path = "crates/watchword-yew023", version = "=0.3.0", default-features = false, optional = true }

[dev-dependencies]
axum08 = { package = "axum", version = "0.8.9", default-features = false, features = ["tokio", "http1", "query", "macros"] }
musli-web05 = { package = "musli-web", version = "0.5.0", default-features = false, features = ["axum08", "tungstenite030"] }
musli = "0.2.0"
serde_json = "1.0.151"
sqll = { version = "0.15.0", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }

[[example]]
name = "sqll-store"
path = "examples/sqll-store/main.rs"
required-features = ["test-util", "sqll015"]
test = true
