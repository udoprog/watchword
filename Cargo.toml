[package]
name = "yew-auth"
version = "0.1.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2024"
description = "Storage-agnostic authentication primitives: roles, password hashing, sessions, signed cookies and Cloudflare Access."
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[lib]
name = "auth"

[dependencies]
aws-lc-rs = "1.18.1"
base64 = "0.22.1"
bcrypt = "0.19.1"
cookie = "0.18.1"
hmac = "0.13.0"
http = "1.5.0"
jiff = "0.2.37"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
