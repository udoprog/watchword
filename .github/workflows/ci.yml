name: CI

on:
  pull_request: {}
  push:
    branches:
      - main
  schedule:
    - cron: '34 21 * * 5'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    # No feature is on by default, so this covers only the types.
    - run: cargo test --workspace --no-default-features
    - run: cargo test --workspace --all-features --all-targets
    - run: cargo test --workspace --all-features --doc

  # Each feature is checked alone, because a feature that only compiles
  # alongside another breaks the apps that take it alone.
  clippy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - run: cargo clippy --all-targets --no-default-features -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features musli01 -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features server -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features cloudflare -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features google -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features axum08 -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features sqll014 -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features yew023 -- -D warnings
    - run: cargo clippy --all-targets --no-default-features --features test-util -- -D warnings
    - run: cargo clippy --all-targets --all-features -- -D warnings
    - run: cargo clippy -p watchword-core --all-targets --no-default-features -- -D warnings
    - run: cargo clippy -p watchword-core --all-targets --no-default-features --features musli01 -- -D warnings
    - run: cargo clippy -p watchword-core --all-targets --no-default-features --features axum08 -- -D warnings
    - run: cargo clippy -p watchword-yew023 --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: wasm32-unknown-unknown
        components: clippy
    - run: cargo check --target wasm32-unknown-unknown --no-default-features --features yew023
    - run: cargo check --target wasm32-unknown-unknown --no-default-features --features yew023,musli01
    - run: cargo check -p watchword-core --target wasm32-unknown-unknown --no-default-features
    - run: cargo check -p watchword-core --target wasm32-unknown-unknown --no-default-features --features musli01
    - run: cargo clippy -p watchword-yew023 --target wasm32-unknown-unknown -- -D warnings

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - run: cargo doc --workspace --all-features --no-deps

  # How docs.rs builds the docs of each crate, with the feature badges of
  # `doc(cfg)`.
  docsrs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: --cfg watchword_docsrs -D warnings
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@nightly
    - run: cargo doc -p watchword --all-features --no-deps
    - run: cargo doc -p watchword-core --all-features --no-deps
    - run: cargo doc -p watchword-yew023 --all-features --no-deps

  rustfmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --check --all
